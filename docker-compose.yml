services:
  postgres:
    image: postgres:17-alpine
    container_name: ms-config-conjunto-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-conjuntos_db}
      POSTGRES_USER: ${DB_USERNAME:-conjuntos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Debe configurar DB_PASSWORD}

    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

    volumes:
      - postgres_conjunto_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_conjunto_data:
    driver: local